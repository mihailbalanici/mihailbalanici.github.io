    - { label: "Autonomous Link-Capacity Adjustment using TeraFlowSDN Controller in a Disaggregated Optical Network Testbed", url: "https://ieeexplore.ieee.org/document/10926455" }
    - { label: "PoC Video Recording of Live Demonstration of Autonomous Link-Capacity Adjustment in Optical Metro-Aggregation Networks", url: "https://www.youtube.com/watch?v=tN3diy9S-hY" }
